name: belefer
description: "Belefér – magyar nyelvű, személyes pénzügykövető."
publish_to: "none"

version: 0.3.3+6

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^13.4.0
  flutter_local_notifications: ^23.0.3
  google_mlkit_text_recognition: ^1.0.3
  home_widget: ^0.10.0
  http: ^1.5.0
  image_picker: ^1.2.0
  package_info_plus: ^10.0.0
  path_provider: ^2.1.5
  printing: ^5.15.1
  sembast: ^3.8.0
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL.txt
    - assets/model/belefer_model.bin

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
