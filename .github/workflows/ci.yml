# Ellenőrzések és buildek minden pushnál:
#  1. formázás, flutter analyze, flutter test
#  2. Android debug APK (letölthető artifact) + alapfolyamat Android-emulátoron
#  3. iOS-szimulátor build + alapfolyamat iOS-szimulátoron
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  checks:
    name: Formázás, analyze, tesztek
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Platformmappák és arculat
        run: bash tool/bootstrap_platforms.sh

      - name: Függőségek a lockfájl szerint
        run: flutter pub get --enforce-lockfile

      - name: Formázás ellenőrzése
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test --reporter expanded

  android:
    name: Android APK + emulátoros próba
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Platformmappák és arculat
        run: bash tool/bootstrap_platforms.sh

      - name: Függőségek
        run: flutter pub get --enforce-lockfile

      - name: Debug APK
        run: |
          flutter build apk --debug
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/belefer-${VERSION}-debug.apk"
          ls -la dist

      - name: APK feltöltése
        uses: actions/upload-artifact@v6
        with:
          name: belefer-android-debug-apk
          path: dist/*.apk
          retention-days: 30

      - name: KVM engedélyezése
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Alapfolyamat Android-emulátoron
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: flutter test integration_test/app_flow_test.dart -d emulator-5554 --reporter expanded

  ios:
    name: iOS-szimulátor build + próba
    needs: checks
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Xcode verzió
        run: xcodebuild -version

      - name: Platformmappák és arculat
        run: bash tool/bootstrap_platforms.sh

      - name: Függőségek
        run: flutter pub get --enforce-lockfile

      - name: iOS-szimulátor build
        run: |
          flutter build ios --simulator --debug
          mkdir -p dist
          ditto -c -k --keepParent build/ios/iphonesimulator/Runner.app dist/belefer-ios-simulator.zip
          ls -la dist

      - name: Szimulátoros build feltöltése
        uses: actions/upload-artifact@v6
        with:
          name: belefer-ios-simulator-app
          path: dist/belefer-ios-simulator.zip
          retention-days: 30

      - name: Alapfolyamat iOS-szimulátoron
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 tool/pick_simulator.py)
          echo "Szimulátor: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          flutter test integration_test/app_flow_test.dart -d "$UDID" --reporter expanded
