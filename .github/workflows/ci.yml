# Ellenőrzések és buildek minden pushnál:
#  1. formázás, flutter analyze, flutter test
#  2. Android debug APK (letölthető artifact) + alapfolyamat Android-emulátoron
#  3. iOS-szimulátor build + alapfolyamat iOS-szimulátoron
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A main ágon minden futás végigmegy; csak a PR-ok régebbi futásai állnak le.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  checks:
    name: Formázás, analyze, tesztek
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Platformmappák és arculat
        run: bash tool/bootstrap_platforms.sh

      - name: Függőségek a lockfájl szerint
        run: flutter pub get --enforce-lockfile

      - name: Formázás ellenőrzése
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_screenshots

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test --reporter expanded

  android:
    name: Android APK + emulátoros próba
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle-tárolók (Maven Central elöl)
        run: |
          mkdir -p ~/.gradle/init.d
          cp tool/ci/gradle-repos.init.gradle ~/.gradle/init.d/repos.gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Platformmappák és arculat
        run: bash tool/bootstrap_platforms.sh

      - name: Függőségek
        run: flutter pub get --enforce-lockfile

      - name: Debug APK
        run: |
          flutter build apk --debug
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/belefer-${VERSION}-debug.apk"
          ls -la dist

      - name: APK feltöltése
        uses: actions/upload-artifact@v6
        with:
          name: belefer-android-debug-apk
          path: dist/*.apk
          retention-days: 30

      - name: KVM engedélyezése
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Alapfolyamat Android-emulátoron
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # A szövegfelismerés előbb a sima debug-, majd a kiadási optimalizálóval
          # (R8) fordított változaton, végül a teljes alapfolyamat.
          script: |
            flutter test integration_test/ocr_test.dart -d emulator-5554 --reporter expanded
            BELEFER_MINIFY_DEBUG=1 flutter test integration_test/ocr_test.dart -d emulator-5554 --reporter expanded
            flutter test integration_test/app_flow_test.dart -d emulator-5554 --reporter expanded

  ios:
    name: iOS-szimulátor build + próba
    needs: checks
    # Az arm64-es macOS runnerek kapacitáshiány miatt sokáig sorban állnak,
    # az Intel-alapú macos-15-intel azonnal elérhető.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Xcode verzió
        run: xcodebuild -version

      - name: Platformmappák és arculat
        run: bash tool/bootstrap_platforms.sh

      - name: Függőségek
        run: flutter pub get --enforce-lockfile

      - name: iOS-szimulátor build
        run: |
          flutter build ios --simulator --debug
          mkdir -p dist
          ditto -c -k --keepParent build/ios/iphonesimulator/Runner.app dist/belefer-ios-simulator.zip
          ls -la dist

      - name: Szimulátoros build feltöltése
        uses: actions/upload-artifact@v6
        with:
          name: belefer-ios-simulator-app
          path: dist/belefer-ios-simulator.zip
          retention-days: 30

      - name: Alapfolyamat iOS-szimulátoron
        timeout-minutes: 45
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 tool/pick_simulator.py)
          echo "Szimulátor: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # Egy kísérlet legfeljebb 20 perc; elakadás esetén a szimulátor
          # újraindul, és még egyszer lefut a próba.
          for attempt in 1 2; do
            if perl -e 'alarm shift; exec @ARGV' 1200 \
              flutter test integration_test/app_flow_test.dart -d "$UDID" --reporter expanded; then
              exit 0
            fi
            echo "::warning::Az iOS-próba ${attempt}. kísérlete nem sikerült vagy elakadt."
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
          done
          exit 1
