# Csak az iOS-szimulátoros build és próba, kézi indításra (választható macOS-képpel).
name: iOS

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner címke"
        required: true
        default: "macos-26"

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  ios:
    name: iOS-szimulátor build + próba
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Xcode verzió
        run: xcodebuild -version

      - name: Platformmappák és arculat
        run: bash tool/bootstrap_platforms.sh

      - name: Függőségek
        run: flutter pub get --enforce-lockfile

      - name: iOS-szimulátor build
        run: |
          flutter build ios --simulator --debug
          mkdir -p dist
          ditto -c -k --keepParent build/ios/iphonesimulator/Runner.app dist/belefer-ios-simulator.zip
          ls -la dist

      - name: Szimulátoros build feltöltése
        uses: actions/upload-artifact@v6
        with:
          name: belefer-ios-simulator-app
          path: dist/belefer-ios-simulator.zip
          retention-days: 30

      - name: Alapfolyamat iOS-szimulátoron
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 tool/pick_simulator.py)
          echo "Szimulátor: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          flutter test integration_test/app_flow_test.dart -d "$UDID" --reporter expanded
