# Telepíthető csomagok kiadása GitHub Release-ként:
# - Android APK (telefonról közvetlenül letölthető, nem zip),
# - aláíratlan iOS IPA saját telepítéshez (SideStore/AltStore írja alá
#   a felhasználó saját Apple ID-jával).
name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Kiadás címkéje (pl. 26.11.0)"
        required: true
        default: "26.11.0"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Platformmappák és arculat
        run: bash tool/bootstrap_platforms.sh

      - name: Függőségek
        run: flutter pub get --enforce-lockfile

      - name: Tesztek
        run: flutter test

      - name: APK-k
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          mkdir -p dist
          # Ajánlott: release módú (gyors, kicsi) APK, debug-kulccsal aláírva.
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "dist/belefer-${{ inputs.tag }}.apk"
          # Hibakereséshez: debug módú APK.
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/belefer-${{ inputs.tag }}-debug.apk"
          (cd dist && sha256sum *.apk | tee SHA256SUMS.txt)
          ls -la dist

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cat > notes.md <<EOF
          Belefér ${TAG} – alkalmazásverzió ${APP_VERSION}, Flutter ${FLUTTER_VERSION}.

          Android teszt-APK. Telefonra a „belefer-${TAG}.apk” fájlt érdemes
          letölteni (release mód, debug-kulccsal aláírva); a „-debug.apk”
          hibakereséshez való. Telepítés: nyisd meg a letöltött fájlt, és
          engedélyezd az ismeretlen forrásból történő telepítést a böngészőnek
          vagy a fájlkezelőnek.

          iPhone: a „belefer-${TAG}-unsigned.ipa” aláíratlan csomag. SideStore-ba
          (vagy AltStore-ba) töltve a saját Apple ID-d írja alá; ingyenes Apple
          ID-val 7 naponta frissíteni kell az aláírást.

          Commit: ${GITHUB_SHA}
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Meglévő kiadás: a fájlok és a leírás frissítése (a címke marad).
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" \
              --title "Belefér ${TAG} (${APP_VERSION})" \
              --notes-file notes.md
          else
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "Belefér ${TAG} (${APP_VERSION})" \
              --notes-file notes.md \
              --prerelease
          fi

  ios-ipa:
    name: Aláíratlan iOS IPA
    needs: release
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Platformmappák és arculat
        run: bash tool/bootstrap_platforms.sh

      - name: Függőségek
        run: flutter pub get --enforce-lockfile

      - name: Release build aláírás nélkül
        run: |
          flutter build ios --release --no-codesign
          APP=build/ios/iphoneos/Runner.app
          # A SideStore az Apple-nél regisztrált App ID nevét a nyers
          # CFBundleDisplayName-ből képzi, és ott csak ASCII karakter lehet
          # („Belefér” → hiba). Ezért az Info.plist-be „Belefer” kerül, a
          # kezdőképernyőn látható „Belefér” nevet pedig a magyar
          # lokalizáció adja (hu.lproj/InfoPlist.strings).
          plutil -replace CFBundleDisplayName -string "Belefer" "$APP/Info.plist"
          mkdir -p "$APP/hu.lproj"
          printf '"CFBundleDisplayName" = "Belefér";\n' > "$APP/hu.lproj/InfoPlist.strings"
          plutil -convert binary1 "$APP/hu.lproj/InfoPlist.strings"
          plutil -lint "$APP/Info.plist" "$APP/hu.lproj/InfoPlist.strings"
          plutil -p "$APP/hu.lproj/InfoPlist.strings"
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          (cd dist && zip -qry "belefer-${{ inputs.tag }}-unsigned.ipa" Payload)
          (cd dist && shasum -a 256 *.ipa | tee SHA256SUMS-ios.txt)
          ls -la dist

      - name: Feltöltés a kiadáshoz
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/*.ipa dist/SHA256SUMS-ios.txt --clobber --repo "$GITHUB_REPOSITORY"
