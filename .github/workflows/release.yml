# Telepíthető Android teszt-APK kiadása GitHub Release-ként.
# A kiadás .apk fájlja telefonról közvetlenül letölthető (nem zip).
name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Kiadás címkéje (pl. 26.11.0)"
        required: true
        default: "26.11.0"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Platformmappák és arculat
        run: bash tool/bootstrap_platforms.sh

      - name: Függőségek
        run: flutter pub get --enforce-lockfile

      - name: Tesztek
        run: flutter test

      - name: Debug APK
        run: |
          flutter build apk --debug
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/belefer-${{ inputs.tag }}-debug.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cat > notes.md <<EOF
          Belefér ${TAG} – alkalmazásverzió ${APP_VERSION}, Flutter ${FLUTTER_VERSION}.

          Android teszt-APK (debug-aláírással). Telepítés: töltsd le az .apk fájlt
          a telefonon, nyisd meg, és engedélyezd az ismeretlen forrásból történő
          telepítést a böngészőnek vagy a fájlkezelőnek.

          Commit: ${GITHUB_SHA}
          EOF
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Belefér ${TAG} (${APP_VERSION})" \
            --notes-file notes.md \
            --prerelease
